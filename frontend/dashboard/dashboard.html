<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoundCars | Dashboard</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />

    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>
</head>

<body onload="validarSessao(); buscarKpis(); buscarCustoMensal(); buscarTipo(); buscarUltimas()">
    <div class="janela">
        <div class="header-left">
            <a href="../index.html"><img src="../image/Foundcars.png" alt="FoundCars Logo"
                    style="max-width: 150px; margin-bottom: 20px;" /></a>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">Motorista</span>!</h3>
            </div>



            <div class="btn-nav botao">
                <h3>Dashboard</h3>
            </div>



            <div class="btn-nav-white botao">
                <a href="./cadastro-veiculo.html">
                    <h3>Cadastrar Veículo</h3>
                </a>
            </div>

            <div class="btn-nav-white botao">
                <a href="./cadastro-manutencao.html">
                    <h3>Cadastrar Manutenção</h3>
                </a>
            </div>

            <div class="btn-logout botao" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        </div>

        <div class="dash">
            <div class="kpi-container">
                <div class="kpi-card">
                    <div class="kpi-title">Veículos Ativos</div>
                    <div class="kpi-value" id="kpi_veiculos">-</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">Custo Total</div>
                    <div class="kpi-value" id="kpi_custo">-</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">Gasto Médio / Manut.</div>
                    <div class="kpi-value" id="kpi_gasto">-</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">Total de Manutenções</div>
                    <div class="kpi-value" id="kpi_total">-</div>
                </div>
            </div>

            <div class="charts-container">
                <div class="chart-box" style="flex: 2;">
                    <div class="chart-title">Custo Mensal de Manutenção (2026)</div>
                    <canvas id="barChart"></canvas>
                </div>
                <div class="chart-box" style="flex: 1; min-width: 300px;">
                    <div class="chart-title">Distribuição por Tipo</div>
                    <canvas id="doughnutChart"></canvas>
                </div>
            </div>

            <div class="table-container">
                <div class="chart-title">Últimas Manutenções Realizadas</div>
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Veículo</th>
                            <th>Tipo</th>
                            <th>Valor</th>
                            <th>Descrição</th>
                        </tr>
                    </thead>
                    <tbody id="tabela_ultimas">
                        <!-- As manutenções dinâmicas aparecerão aqui -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        if (sessionStorage.NOME_USUARIO) {
            document.getElementById('b_usuario').innerHTML = sessionStorage.NOME_USUARIO;
        }
        const ctxBar = document.getElementById('barChart').getContext('2d');
        var graficoDeBarras = new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: [], // Preencher via JS
                datasets: [{
                    label: 'Custo R$',
                    data: [], // Preencher via JS
                    backgroundColor: 'rgba(1, 6, 29, 0.8)',
                    borderColor: '#01061d',
                    borderWidth: 1,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
        const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
        var graficoRosca = new Chart(ctxDoughnut, {
            type: 'doughnut',
            data: {
                labels: [], // Preencher via JS
                datasets: [{
                    data: [], // Preencher via JS
                    backgroundColor: [
                        '#5cb85c',
                        '#d9534f',
                        '#f0ad4e',
                        '#5bc0de'
                    ],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                cutout: '70%',
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
        //buscando dados das KPIs e calculando a media de gasto
        function buscarKpis() {
            var idUsuario = sessionStorage.ID_USUARIO;
            fetch(`/manutencao/kpis/${idUsuario}`).then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (respostaJson) {

                        var custo = Number(respostaJson.custoTotal || 0);  // usando o || 0 para caso nao houver, o valor padrao seja 0
                        var total = Number(respostaJson.totalManutencoes || 0);

                        var gastoMedioCalculado = 0;
                        if (total > 0) {
                            gastoMedioCalculado = custo / total;
                        }
                        document.getElementById("kpi_veiculos").innerHTML = respostaJson.veiculosAtivos;
                        document.getElementById("kpi_custo").innerHTML = "R$ " + custo.toFixed(2);
                        document.getElementById("kpi_gasto").innerHTML = "R$ " + gastoMedioCalculado.toFixed(2);
                        document.getElementById("kpi_total").innerHTML = total;
                    });
                }
            });
        }

        // funcao para buscar os dados para grafico de barras
        function buscarCustoMensal() {
            var idUsuario = sessionStorage.ID_USUARIO;

            fetch(`/manutencao/custo-mensal/${idUsuario}`).then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (respostaJson) {
                        var nomeDosMeses = ['', 'Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
                        var mesesLabel = [];
                        var valoresCustos = [];

                        for (let i = 0; i < respostaJson.length; i++) {
                            var mesNumero = respostaJson[i].mes;
                            mesesLabel.push(nomeDosMeses[mesNumero]);
                            valoresCustos.push(respostaJson[i].custo);

                        }

                        graficoDeBarras.data.labels = mesesLabel;
                        graficoDeBarras.data.datasets[0].data = valoresCustos;
                        graficoDeBarras.update();
                    });
                }
            });
        }

        //buscar tipos de mantencao para o grafico de rosca
        function buscarTipo() {
            var idUsuario = sessionStorage.ID_USUARIO

            fetch(`/manutencao/buscar-distribuicao/${idUsuario}`).then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (respostaJson) {
                        var tiposLabel = [];
                        var quantidades = [];

                        for (let i = 0; i < respostaJson.length; i++) {
                            tiposLabel.push(respostaJson[i].tipo);
                            quantidades.push(respostaJson[i].quantidade);
                        }
                        graficoRosca.data.labels = tiposLabel;
                        graficoRosca.data.datasets[0].data = quantidades;
                        graficoRosca.update();
                    });
                }
            });
        }

        //buscando ultimas mantencoes para a tabela
        function buscarUltimas() {
            var idUsuario = sessionStorage.ID_USUARIO;

            fetch(`/manutencao/buscar-ultimas/${idUsuario}`).then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (respostaJson) {

                        var tabela = document.getElementById("tabela_ultimas");
                        tabela.innerHTML = "";

                        for (let i = 0; i < respostaJson.length; i++) {
                            var manut = respostaJson[i];

                            var classeBadge = "bg-prev";
                            if (manut.tipo === "Corretiva") classeBadge = "bg-corr";
                            if (manut.tipo === "Upgrade") classeBadge = "bg-up";
                            if (manut.tipo === "Estética") classeBadge = "bg-est";

                            var novaLinha = `
                                <tr>
                                    <td>${manut.dataFormatada}</td>
                                    <td>${manut.veiculo}</td>
                                    <td><span class="badge ${classeBadge}">${manut.tipo}</span></td>
                                    <td>R$ ${Number(manut.valor).toFixed(2)}</td>
                                    <td>${manut.descricao}</td>
                                </tr>
                            `;

                            tabela.innerHTML += novaLinha;
                        }
                    });
                }
            });
        }
    </script>
</body>

</html>
